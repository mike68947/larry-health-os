# Позиции фармакогенетической панели в GRCh38 (плюс-цепь) — тот же набор rsid, что в
# pharmaco_panel_grch37.yaml; читается vcf_import_pipeline.phase_r для VCF, собранного на GRCh38
# (DRAGEN/Nucleus, tellmeGen hg38). В raw_snps координаты пишутся по-прежнему в GRCh37 (конвенция
# чипа 23andMe), совпадение с файлом ищется по этим позициям.
# Как получены (2026-10-31): сдвиг GRCh37→GRCh38 постоянен внутри блока выравнивания
# (chr10 −1 759 757; chr1 −465 556; chr6 −231; chr2 −908 646; chr12 −152 934); каждая позиция
# проверена по локальному UCSC hg38.fa — референсная буква совпала с ref панели во всех 13;
# rs12248560 дополнительно подтверждён dbSNP-идентификатором в VCF DRAGEN hg38. Сеть не использовалась.
# CYP2D6 и HLA-B не входят по тем же причинам, что в GRCh37-панели.
